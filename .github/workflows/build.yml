# Builds StarHash on every push and pull request: the core tests (menus, balances, charge verdicts on the demo
# network), then the APK. Every push to main publishes a GitHub release v<VERSION>.<build number> with
#   StarHash-<version>.apk  and  StarHash.apk (the same file under a fixed name, for ".../releases/latest/download/StarHash.apk").
# Optional secrets for a private signing key: STARHASH_KEYSTORE_BASE64, STARHASH_KEYSTORE_PASSWORD, STARHASH_KEY_ALIAS,
# STARHASH_KEY_PASSWORD. Without them the APK is signed with the shared key in keystore/ (installs over earlier builds).
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Tests and APK
    runs-on: ubuntu-latest
    env:
      STARHASH_BUILD: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.STARHASH_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Release number
        run: echo "STARHASH_VERSION=$(tr -d '[:space:]' < VERSION).$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Signing key from the secrets
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.STARHASH_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/starhash.jks"
          echo "STARHASH_KEYSTORE=$RUNNER_TEMP/starhash.jks" >> "$GITHUB_ENV"

      - name: Core tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: Build the APK
        env:
          STARHASH_KEYSTORE_PASSWORD: ${{ secrets.STARHASH_KEYSTORE_PASSWORD }}
          STARHASH_KEY_ALIAS: ${{ secrets.STARHASH_KEY_ALIAS }}
          STARHASH_KEY_PASSWORD: ${{ secrets.STARHASH_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/StarHash-$STARHASH_VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk out/StarHash.apk
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: StarHash-${{ env.STARHASH_VERSION }}
          path: out/StarHash-${{ env.STARHASH_VERSION }}.apk

      - name: Publish the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.STARHASH_VERSION }}
          name: StarHash ${{ env.STARHASH_VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            out/StarHash-${{ env.STARHASH_VERSION }}.apk
            out/StarHash.apk
          body: |
            **StarHash ${{ env.STARHASH_VERSION }}**: USSD and VAS QA app by INNOVII.

            Install `StarHash-${{ env.STARHASH_VERSION }}.apk` on an Android 8+ phone with the test SIM, then follow the setup card
            (Phone and SMS permissions, accessibility service). `StarHash.apk` is the same file under a fixed name.
